# storage.cfg -- what discipline/storage.py mirrors and snapshots.  key = value.
#
# part = NAME=PATH      a root the index reads, under this name (repeatable).  When no
#                       part is given the space itself is the only part.
# canonical = GLOB      a glob, relative to the space, naming final files to mirror; a
#                       .out beside each is mirrored with it (repeatable)
# mirror = PATH         the mirror directory, relative to the space; no mirror if unset
# exclude = PREFIX      a path prefix, relative to its part, the index does not read
#
# canonical = proofs/*.lean
# canonical = proofs/*.v
# mirror = mirror
